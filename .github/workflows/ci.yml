name: CI - Build and Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  FRONTEND_IMAGE: frontend
  BACKEND_IMAGE: backend
  IMAGE_TAG: ${{ github.sha }}

  # Pin the Trivy CLI version
  TRIVY_VERSION: v0.74.0

jobs:
  build-and-scan:
    name: Build Docker Images and Scan
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 3. Build frontend image
      # --------------------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend

      # --------------------------------------------------
      # 4. Build backend image
      # --------------------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend

      # --------------------------------------------------
      # 5. Verify image IDs
      # --------------------------------------------------
      - name: Verify Docker images
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # --------------------------------------------------
      # 6. Verify Python package versions inside images
      # --------------------------------------------------
      - name: Verify frontend Python packages
        run: |
          docker run --rm \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      - name: Verify backend Python packages
        run: |
          docker run --rm \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      # --------------------------------------------------
      # 7. Run Trivy scan on frontend
      # --------------------------------------------------
      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      # --------------------------------------------------
      # 8. Run Trivy scan on backend
      # --------------------------------------------------
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      # --------------------------------------------------
      # 9. Upload frontend scan report
      # --------------------------------------------------
      - name: Upload frontend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif

      # --------------------------------------------------
      # 10. Upload backend scan report
      # --------------------------------------------------
      - name: Upload backend Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif