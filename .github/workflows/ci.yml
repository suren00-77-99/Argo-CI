name: CI - Lint, Test, Build, Scan and Push to ECR

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

  FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
  BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}

  FRONTEND_IMAGE: frontend
  BACKEND_IMAGE: backend

  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: v0.74.0

jobs:

  # ==========================================================
  # STAGE 1 - LINT
  # ==========================================================

  lint:
    name: Stage 1 - Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint frontend with Ruff
        working-directory: frontend
        run: |
          python -m ruff check .

      - name: Lint backend with Ruff
        working-directory: backend
        run: |
          python -m ruff check .

  # ==========================================================
  # STAGE 2 - TEST
  # ==========================================================

  test:
    name: Stage 2 - Test
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run frontend tests
        working-directory: frontend
        run: |
          python -m pytest -v

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v

  # ==========================================================
  # STAGE 3 - BUILD
  # ==========================================================

  build:
    name: Stage 3 - Build Docker Images
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Verify frontend image
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Verify backend image
        run: |
          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Save frontend image
        run: |
          docker save \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -o frontend-image.tar

      - name: Save backend image
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -o backend-image.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            frontend-image.tar
            backend-image.tar
          retention-days: 1

  # ==========================================================
  # STAGE 4 - SECURITY SCAN
  # ==========================================================

  scan:
    name: Stage 4 - Trivy Security Scan
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load frontend Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Load backend Docker image
        run: |
          docker load -i backend-image.tar

      - name: Verify loaded images
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Verify frontend Python packages
        run: |
          docker run --rm \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      - name: Verify backend Python packages
        run: |
          docker run --rm \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Upload frontend Trivy report
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload backend Trivy report
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-frontend.sarif
            trivy-backend.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================
  # STAGE 5 - AUTHENTICATE TO AWS USING OIDC
  # ==========================================================

  aws-auth:
    name: Stage 5 - AWS OIDC Authentication
    runs-on: ubuntu-24.04
    needs: scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.ecr-details.outputs.ecr_registry }}
      frontend_repository: ${{ steps.ecr-details.outputs.frontend_repository }}
      backend_repository: ${{ steps.ecr-details.outputs.backend_repository }}

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Set ECR details
        id: ecr-details
        run: |
          echo "ecr_registry=${{ env.ECR_REGISTRY }}" >> "$GITHUB_OUTPUT"
          echo "frontend_repository=${{ env.FRONTEND_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "backend_repository=${{ env.BACKEND_REPOSITORY }}" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # STAGE 6 - CREATE ECR REPOSITORIES IF NOT PRESENT
  # ==========================================================

  create-ecr:
    name: Stage 6 - Create ECR Repositories
    runs-on: ubuntu-24.04
    needs: aws-auth

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create frontend ECR repository if missing
        run: |
          if aws ecr describe-repositories \
            --repository-names "${{ env.FRONTEND_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then

            echo "Frontend ECR repository already exists."

          else

            echo "Frontend ECR repository does not exist."
            echo "Creating frontend ECR repository..."

            aws ecr create-repository \
              --repository-name "${{ env.FRONTEND_REPOSITORY }}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              --region "${{ env.AWS_REGION }}"

          fi

      - name: Create backend ECR repository if missing
        run: |
          if aws ecr describe-repositories \
            --repository-names "${{ env.BACKEND_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then

            echo "Backend ECR repository already exists."

          else

            echo "Backend ECR repository does not exist."
            echo "Creating backend ECR repository..."

            aws ecr create-repository \
              --repository-name "${{ env.BACKEND_REPOSITORY }}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              --region "${{ env.AWS_REGION }}"

          fi

      - name: List ECR repositories
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.FRONTEND_REPOSITORY }}" \
            "${{ env.BACKEND_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}"

  # ==========================================================
  # STAGE 7 - PUSH IMAGES TO AMAZON ECR
  # ==========================================================

  push-ecr:
    name: Stage 7 - Push Images to Amazon ECR
    runs-on: ubuntu-24.04
    needs:
      - scan
      - create-ecr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      frontend_image: ${{ steps.image-urls.outputs.frontend_image }}
      backend_image: ${{ steps.image-urls.outputs.backend_image }}
      image_tag: ${{ steps.image-urls.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load frontend Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Load backend Docker image
        run: |
          docker load -i backend-image.tar

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR image URLs
        id: image-urls
        run: |
          FRONTEND_IMAGE_URL="${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}"
          BACKEND_IMAGE_URL="${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}"

          echo "frontend_image=${FRONTEND_IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

          echo "Frontend image: ${FRONTEND_IMAGE_URL}:${{ env.IMAGE_TAG }}"
          echo "Backend image: ${BACKEND_IMAGE_URL}:${{ env.IMAGE_TAG }}"

      - name: Tag frontend image for ECR
        run: |
          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Tag backend image for ECR
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push frontend image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push backend image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Tag frontend image as latest
        run: |
          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:latest

      - name: Tag backend image as latest
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:latest

      - name: Push frontend latest tag
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:latest

      - name: Push backend latest tag
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:latest

      - name: Verify pushed frontend image
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.FRONTEND_REPOSITORY }}" \
            --image-ids imageTag="${{ env.IMAGE_TAG }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify pushed backend image
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.BACKEND_REPOSITORY }}" \
            --image-ids imageTag="${{ env.IMAGE_TAG }}" \
            --region "${{ env.AWS_REGION }}"

  # ==========================================================
  # STAGE 8 - TRIGGER GITOPS REPOSITORY
  # ==========================================================

  cd-trigger:
    name: Stage 8 - Trigger GitOps Repository
    runs-on: ubuntu-24.04
    needs: push-ecr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger GitOps repository
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          FRONTEND_IMAGE: ${{ needs.push-ecr.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.push-ecr.outputs.backend_image }}
          IMAGE_TAG: ${{ needs.push-ecr.outputs.image_tag }}

        run: |
          curl --fail-with-body \
            --request POST \
            --url https://api.github.com/repos/${{ vars.GITOPS_REPO }}/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITOPS_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{
              \"event_type\": \"image-updated\",
              \"client_payload\": {
                \"frontend_image\": \"${FRONTEND_IMAGE}\",
                \"backend_image\": \"${BACKEND_IMAGE}\",
                \"image_tag\": \"${IMAGE_TAG}\"
              }
            }"