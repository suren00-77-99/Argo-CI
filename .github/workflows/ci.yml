name: CI - Docker Build and Trivy Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  FRONTEND_IMAGE: frontend
  BACKEND_IMAGE: backend
  IMAGE_TAG: ${{ github.sha }}

  # Pinned Trivy CLI version
  TRIVY_VERSION: v0.74.0

jobs:
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Docker Buildx
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 3. Build frontend image
      # --------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend

      # --------------------------------------------------
      # 4. Build backend image
      # --------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend

      # --------------------------------------------------
      # 5. Verify image IDs
      # --------------------------------------------------
      - name: Verify Docker images
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # --------------------------------------------------
      # 6. Verify Python packages in frontend
      # --------------------------------------------------
      - name: Verify frontend Python packages
        run: |
          docker run --rm \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      # --------------------------------------------------
      # 7. Verify Python packages in backend
      # --------------------------------------------------
      - name: Verify backend Python packages
        run: |
          docker run --rm \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      # --------------------------------------------------
      # 8. Install pinned Trivy version
      # --------------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: alpine:3.20
          format: table
          exit-code: '0'

      # --------------------------------------------------
      # 9. Scan frontend image
      # --------------------------------------------------
      - name: Scan frontend image with Trivy
        id: trivy-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      # --------------------------------------------------
      # 10. Scan backend image
      # --------------------------------------------------
      - name: Scan backend image with Trivy
        id: trivy-backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      # --------------------------------------------------
      # 11. Upload frontend SARIF only if it exists
      # --------------------------------------------------
      - name: Upload frontend Trivy report
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif

      # --------------------------------------------------
      # 12. Upload backend SARIF only if it exists
      # --------------------------------------------------
      - name: Upload backend Trivy report
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif