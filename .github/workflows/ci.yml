name: CI - Build Scan Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_GITHUB_ROLE_ARN: ${{ vars.AWS_GITHUB_ROLE_ARN }}
  FRONTEND_REPOSITORY: gitops-demo-frontend
  BACKEND_REPOSITORY: gitops-demo-backend
  CD_REPOSITORY: suren00-77-99/Argo-CD
  CD_BRANCH: main

permissions:
  contents: read
  id-token: write

jobs:
  lint-syntax:
    name: Lint and Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check frontend backend
      - run: python -m compileall frontend backend

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: lint-syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r frontend/requirements.txt -r backend/requirements.txt
      - run: pytest frontend/tests backend/tests -q

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: unit-test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - run: |
          docker build -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.meta.outputs.tag }}" frontend
          docker build -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.meta.outputs.tag }}" backend

  scan:
    name: Scan Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build local images for scanning
        run: |
          TAG="v${{ github.run_number }}"
          docker build -t frontend:$TAG frontend
          docker build -t backend:$TAG backend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: frontend:v${{ github.run_number }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: backend:v${{ github.run_number }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  push-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [build, scan]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ROLE_ARN  }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # This must be its own step with a separate dash (-)
      - name: Build and Push Images to ECR
        run: |
          VERSION_TAG="v${{ github.run_number }}"
          
          # 1. Automatically create ECR repositories if they do not exist yet
          echo "Checking/creating ECR repositories..."
          aws ecr create-repository --repository-name "$FRONTEND_REPOSITORY" --region "$AWS_REGION" || echo "Frontend repository already exists."
          aws ecr create-repository --repository-name "$BACKEND_REPOSITORY" --region "$AWS_REGION" || echo "Backend repository already exists."
          
          # 2. Build and push Frontend with both tags
          echo "Building and pushing Frontend..."
          docker build -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$VERSION_TAG" -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest" frontend
          docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$VERSION_TAG"
          docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest"
          
          # 3. Build and push Backend with both tags
          echo "Building and pushing Backend..."
          docker build -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$VERSION_TAG" -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest" backend
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:$VERSION_TAG"
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest"


  update-gitops:
    name: Update CD Repository
    runs-on: ubuntu-latest
    needs: push-ecr
    steps:
      - name: Checkout CD repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CD_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: ${{ env.CD_BRANCH }}
          path: cd-repo

      - name: Update image tags
        env:
          TAG: ${{ github.sha }}
        run: |
          TAG="${TAG::12}"
          sed -i "s/tag:.*/tag: $TAG/" cd-repo/environments/dev/frontend-values.yaml
          sed -i "s/tag:.*/tag: $TAG/" cd-repo/environments/dev/backend-values.yaml

      - name: Commit GitOps change
        working-directory: cd-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/frontend-values.yaml environments/dev/backend-values.yaml
          git commit -m "chore: deploy image ${GITHUB_SHA::12}" || exit 0
          git push
