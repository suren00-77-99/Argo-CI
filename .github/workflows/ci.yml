name: CI - Build Scan Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 123456789012.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPOSITORY: gitops-demo-frontend
  BACKEND_REPOSITORY: gitops-demo-backend
  CD_REPOSITORY: YOUR_ORG/gitops-cd
  CD_BRANCH: main

permissions:
  contents: read
  id-token: write

jobs:
  lint-syntax:
    name: Lint and Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check frontend backend
      - run: python -m compileall frontend backend

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: lint-syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r frontend/requirements.txt -r backend/requirements.txt
      - run: pytest frontend/tests backend/tests -q

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: unit-test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - run: |
          docker build -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${{ steps.meta.outputs.tag }}" frontend
          docker build -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:${{ steps.meta.outputs.tag }}" backend

  scan:
    name: Scan Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t frontend:${GITHUB_SHA::12} frontend
          docker build -t backend:${GITHUB_SHA::12} backend
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  push-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [build, scan]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          TAG=${GITHUB_SHA::12}
          docker build -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$TAG" frontend
          docker build -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$TAG" backend
          docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$TAG"
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:$TAG"

  update-gitops:
    name: Update CD Repository
    runs-on: ubuntu-latest
    needs: push-ecr
    steps:
      - name: Checkout CD repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CD_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: ${{ env.CD_BRANCH }}
          path: cd-repo

      - name: Update image tags
        env:
          TAG: ${{ github.sha }}
        run: |
          TAG="${TAG::12}"
          sed -i "s/tag:.*/tag: $TAG/" cd-repo/environments/dev/frontend-values.yaml
          sed -i "s/tag:.*/tag: $TAG/" cd-repo/environments/dev/backend-values.yaml

      - name: Commit GitOps change
        working-directory: cd-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/frontend-values.yaml environments/dev/backend-values.yaml
          git commit -m "chore: deploy image ${GITHUB_SHA::12}" || exit 0
          git push
