name: CI - Lint, Test, Build, Scan and Push

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  FRONTEND_IMAGE: frontend
  BACKEND_IMAGE: backend
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: v0.74.0

jobs:

  # ======================================================
  # STAGE 1 - LINT
  # ======================================================
  lint:
    name: Stage 1 - Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint frontend with Ruff
        working-directory: frontend
        run: |
          python -m ruff check .

      - name: Lint backend with Ruff
        working-directory: backend
        run: |
          python -m ruff check .

  # ======================================================
  # STAGE 2 - TEST
  # ======================================================
  test:
    name: Stage 2 - Test
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            frontend/requirements.txt
            backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run frontend tests
        working-directory: frontend
        run: |
          python -m pytest -v

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v

  # ======================================================
  # STAGE 3 - BUILD
  # ======================================================
  build:
    name: Stage 3 - Build Docker Images
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Verify frontend image
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Verify backend image
        run: |
          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Save frontend image
        run: |
          docker save \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -o frontend-image.tar

      - name: Save backend image
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -o backend-image.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            frontend-image.tar
            backend-image.tar
          retention-days: 1

  # ======================================================
  # STAGE 4 - SCAN
  # ======================================================
  scan:
    name: Stage 4 - Trivy Security Scan
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load frontend Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Load backend Docker image
        run: |
          docker load -i backend-image.tar

      - name: Verify loaded images
        run: |
          docker image inspect \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker image inspect \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Verify frontend Python packages
        run: |
          docker run --rm \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      - name: Verify backend Python packages
        run: |
          docker run --rm \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            python -m pip show msgpack setuptools

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Upload frontend Trivy report
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload backend Trivy report
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-frontend.sarif
            trivy-backend.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ======================================================
  # STAGE 5 - PUSH
  # ======================================================
  push:
    name: Stage 5 - Push Images to Docker Hub
    runs-on: ubuntu-24.04
    needs: scan

    # Push only for pushes to main.
    # Pull requests should not push images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load frontend Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Load backend Docker image
        run: |
          docker load -i backend-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag frontend image
        run: |
          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Tag backend image
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ env.IMAGE_TAG }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Push frontend image
        run: |
          docker push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ env.IMAGE_TAG }}

          docker push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

      - name: Push backend image
        run: |
          docker push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ env.IMAGE_TAG }}

          docker push \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

  # ======================================================
  # STAGE 6 - CD TRIGGER
  # ======================================================
  cd-trigger:
    name: Stage 6 - Trigger CD
    runs-on: ubuntu-24.04
    needs: push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger GitOps repository
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url https://api.github.com/repos/${{ github.repository_owner }}/Argo-GitOps/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITOPS_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{
              "event_type": "image-updated",
              "client_payload": {
                "frontend_image": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend",
                "backend_image": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend",
                "image_tag": "${{ env.IMAGE_TAG }}"
              }
            }'